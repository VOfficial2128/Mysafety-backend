
version: 0.2

phases:
  install:
    commands:
      - echo "Starting MySafety build"

  pre_build:
    commands:
      - echo "Checking required deployment files"
      - test -f Dockerfile
      - test -f docker-compose.yml
      - test -f scripts/deploy.sh
      - echo "All required files found"

  build:
    commands:
      - echo "Validating Docker Compose configuration"
      - docker compose version
      - echo "MySafety build validation completed"

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '.git/**/*'
    - 'node_modules/**/*'
    - '.env'
    - '**/.env'
    - 'serviceAccountKey.json'
